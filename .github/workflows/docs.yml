name: Documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt
      - name: Build and check all internal references
        run: python -m sphinx -E -a -n -W --keep-going -b html docs docs/_build/html
      - name: Install PDF documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y latexmk tex-gyre texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended
      - name: Build PDF documentation
        run: make -C docs latexpdf SPHINXOPTS="-W --keep-going"
      - uses: actions/upload-artifact@v4
        with:
          name: ctreeballs-documentation
          path: docs/_build/html
      - uses: actions/upload-artifact@v4
        with:
          name: ctreeballs-documentation-pdf
          path: docs/_build/latex/ctreeballs.pdf
