name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-public-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-profile prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/release.txt
      - name: Select affected regression owners
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          python scripts/generate_capabilities.py --check
          python scripts/generate_profile_docs.py --check
          base="$PR_BASE"
          if [ -z "$base" ]; then base="$(git rev-parse HEAD^ 2>/dev/null || true)"; fi
          if [ -n "$base" ]; then
            python scripts/affected_regressions.py --base "$base" --output regression-selection.json
          else
            python scripts/affected_regressions.py --output regression-selection.json
          fi
      - name: Verify the unchanged public profile and every registered method
        run: |
          python scripts/active_release_gate.py --output release-gate \
            --mpi-command 'mpiexec --oversubscribe --bind-to none'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: active-public-release-evidence
          path: |
            release-gate/
            regression-selection.json

  octree-3pcf-3d-mpi:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        omp_sibling: ["0", "1"]
    env:
      MAKEFLAGS: "-e"
      CC: mpicc
      DEFDIMENSION: "3"
      OCTREE3PCF3DMPION: "1"
      OCTREE3PCF3DOMPON: ${{ matrix.omp_sibling }}
      BALLTREEMPION: "0"
      BALLTREE2BALLSMPION: "0"
      BALLTREE2BALLSMPI3PCFON: "0"
      OCTREE2BALLSMPION: "0"
      OCTREEGGGMPION: "0"
      OCTREEBALLS4MPION: "0"
      LYAFORESTMPION: "0"
      CFITSIOON: "0"
      CFITSIOLIBON: "0"
      USEGSL: "1"
      GSLINTERNAL: "0"
      CLASSLIBON: "1"
      PXDON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/build.txt mpi4py
      - name: Build matching C and Cython MPI profiles
        run: |
          make -j2 cballs cyballs-static-lib
          CBALLS_STATIC_LIBRARY_READY=1 python setup.py build_ext --inplace
      - name: Check scalar and survey oracles, ranks, threads, and recovery
        run: |
          extra=()
          if [ "$OCTREE3PCF3DOMPON" = 0 ]; then extra+=(--mpi-only); fi
          PYTHONPATH="$PWD:$PWD/tests/python" python tests/python/test_octree_3pcf_3d_mpi.py \
            --cballs ./cballs --mpi-command 'mpiexec --oversubscribe -n 2' \
            --cython "${extra[@]}"
          make test-make-info
      - name: Check OpenMP baseline
        if: matrix.omp_sibling == '1'
        run: make test-octree-3pcf-3d-omp

  lya-forest-mpi:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        omp_siblings: ["0", "1"]
    env:
      MAKEFLAGS: "-e"
      CC: mpicc
      DEFDIMENSION: "3"
      LYAFORESTMPION: "1"
      LYAFORESTOMPON: ${{ matrix.omp_siblings }}
      SMOOTHPIVOTON: "0"
      BALLTREEMPION: "0"
      BALLTREE2BALLSMPION: "0"
      BALLTREE2BALLSMPI3PCFON: "0"
      OCTREE2BALLSMPION: "0"
      OCTREEGGGMPION: "0"
      OCTREEBALLS4MPION: "0"
      CFITSIOON: "0"
      CFITSIOLIBON: "0"
      USEGSL: "1"
      GSLINTERNAL: "0"
      CLASSLIBON: "1"
      PXDON: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/build.txt mpi4py pytest astropy matplotlib
      - name: Build C and Cython with the same MPI profile
        run: |
          make -j2 cballs cyballs-static-lib
          CBALLS_STATIC_LIBRARY_READY=1 python setup.py build_ext --inplace
      - name: Compare every MPI mode, oracles, threads, and recoverable failures
        run: |
          extra=()
          if [ "$LYAFORESTOMPON" = 0 ]; then extra+=(--mpi-only); fi
          PYTHONPATH="$PWD:$PWD/tests/python" python tests/python/test_lya_forest_mpi.py \
            --cballs ./cballs --mpi-command 'mpiexec --oversubscribe -n 2' \
            --cython "${extra[@]}"
          make test-make-info
      - name: Preserve the OpenMP baseline
        if: matrix.omp_siblings == '1'
        run: make test-lya-forest-omp test-lya-forest-1d-omp test-lya-forest-los-tree
      - name: Forest driver, DESI fixtures, in-memory oracles and two-rank suite
        env:
          LYA_DRIVER_MPI_COMMAND: "mpiexec --oversubscribe -n 2"
        run: |
          PYTHONPATH="$PWD:$PWD/tests/python" python -m pytest -q \
            tests/python/test_lya_corr_all_engines.py

  two-ball-edge:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        dimension: [2, 3]
    env:
      # Use one profile for direct make calls and setup.py's make queries.
      MAKEFLAGS: "-e"
      CC: mpicc
      DEFDIMENSION: ${{ matrix.dimension }}
      CFITSIOON: "0"
      CFITSIOLIBON: "0"
      USEGSL: "1"
      GSLINTERNAL: "0"
      CLASSLIBON: "1"
      PXDON: "1"
      SMOOTHPIVOTON: "0"
      TWOPCFON: "1"
      TPCFON: "1"
      BALLTREE2BALLSOMPON: "1"
      BALLTREE2BALLSMPION: "1"
      OCTREE2BALLSOMPON: "1"
      OCTREE2BALLSMPION: "1"
      LYAFORESTOMPON: "0"
      LYAFORESTMPION: "0"
      OCTREESHEARSPHERE2BALLSOMPON: "0"
      OCTREESHEARSPHERE2BALLSMPION: "0"
      KDTREESHEARSPHERE2BALLSOMPON: "0"
      KDTREESHEARSPHERE2BALLSMPION: "0"
      BALLTREESHEARSPHERE2BALLSOMPON: "0"
      BALLTREESHEARSPHERE2BALLSMPION: "0"
      OCTREE3PCF3DOMPON: "0"
      OCTREE3PCF3DMPION: "0"
      OCTREEBALLS4OMPON: "0"
      OCTREEBALLS4MPION: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build and reference dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/build.txt pytest
      - name: Build the selected C profile
        run: make -j2 cballs cyballs-static-lib
      - name: Check windows, correction, masks, MPI, and deterministic reduction
        run: |
          python tests/python/test_two_ball_edge_corrections.py \
            --cballs ./cballs --dimension "$DEFDIMENSION" \
            --mpi-command 'mpiexec --oversubscribe -n 2'
      - name: Build Cython and check in-memory edge corrections
        if: matrix.dimension == 3
        run: |
          CBALLS_STATIC_LIBRARY_READY=1 python setup.py build_ext --inplace
          python -m pytest -q tests/python/test_two_ball_edge_cython.py \
            tests/python/test_kappa_corr_all_engines.py

  c-regressions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/build.txt
      - name: Build C executable with strict warnings
        run: make -j2 DEBUGCOMPILINGON=1 cballs
      - name: Run production cell contracts
        run: make DEBUGCOMPILINGON=1 test-cell-production
      - name: Run C startup and numerical regressions
        run: |
          make DEBUGCOMPILINGON=1 test-parameter-parser
          make DEBUGCOMPILINGON=1 test-parameter-file-parser
          make DEBUGCOMPILINGON=1 test-standalone-parser
          THREADS=4 REPEATS=2 make test-p0-regressions
          make test-p2-regressions
          make test-octree-3pcf-3d-omp
      - name: Compare every active OpenMP search
        run: MULTI_THREADS=4 make test-openmp-determinism

  cython-regressions:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native and Python build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install --upgrade pip setuptools wheel \
            "Cython>=0.29.36,<4" "numpy>=2.0"
      - name: Build and install Cython extension
        run: python -m pip install . --no-build-isolation
      - name: Run Cython lifecycle regressions
        run: |
          python tests/python/test_p0_cython_instances.py
          python tests/python/test_p1_cython.py
          python tests/python/test_p2_cython.py
          python tests/python/test_p3_cython_startup.py
          python tests/python/test_shear_sphere_octree_omp.py

  install-sdist:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install --upgrade build twine
      - name: Build and inspect the source distribution
        run: |
          python -m build --sdist
          python -m twine check --strict dist/*.tar.gz
          mkdir -p release-package
          python scripts/check_sdist.py dist/*.tar.gz --output release-package/sdist.json
      - name: Build native and isolated wheel from the archive, then compute outside it
        run: |
          python scripts/verify_sdist_install.py dist/*.tar.gz \
            --output release-package/artifact-check --jobs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-install-evidence
          path: |
            release-package/
            !release-package/**/native-env/**
            !release-package/**/install-env/**
            !release-package/**/native-source/**
            !release-package/**/wheel-source/**
            dist/

  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install -r requirements/build.txt
      - name: Build with AddressSanitizer and UndefinedBehaviorSanitizer
        run: |
          make -j2 DEBUGCOMPILINGON=1 SANITIZER=address,undefined cballs
      - name: Run focused sanitizer paths
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make DEBUGCOMPILINGON=1 SANITIZER=address,undefined test-parameter-parser
          make DEBUGCOMPILINGON=1 SANITIZER=address,undefined test-parameter-file-parser
          make DEBUGCOMPILINGON=1 SANITIZER=address,undefined test-standalone-parser
          make DEBUGCOMPILINGON=1 SANITIZER=address,undefined test-sanitizer-smoke
          make DEBUGCOMPILINGON=1 SANITIZER=address,undefined test-octree-3pcf-3d-omp
