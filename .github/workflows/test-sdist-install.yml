name: Continuous integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  MAKEFLAGS: "-e"
  CC: mpicc
  DEFDIMENSION: "3"
  USEGSL: "1"
  GSLINTERNAL: "0"
  CFITSIOON: "1"
  CLASSLIBON: "1"
  PXDON: "1"

jobs:
  active-native-profile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev libsleef-dev zlib1g-dev
          python -m pip install --upgrade pip setuptools wheel "Cython>=0.29.36,<4" "numpy>=2.0" pytest astropy matplotlib mpi4py
      - name: Build the active C and Cython profile
        run: |
          make -j2 cballs cyballs-static-lib
          CBALLS_STATIC_LIBRARY_READY=1 python setup.py build_ext --inplace
      - name: Check runtime inventories and C contracts
        run: |
          make test-search-methods test-make-info test-option-cache
          make test-parameter-parser test-parameter-file-parser test-cell-production
      - name: Check active Python benchmark drivers
        run: |
          PYTHONPATH="$PWD:$PWD/python" python -m pytest -q \
            tests/make_tests/test_kappa_corr_all_engines.py \
            tests/make_tests/test_shear_corr_all_engines.py \
            tests/make_tests/test_lya_corr_all_engines.py \
            tests/make_tests/test_runtime_help_registry.py
      - name: Check active scalar and shear engines
        run: |
          make test-kdtree-2balls-omp test-balltree-2balls-omp test-octree-2balls-omp
          make test-shear-sphere-2balls test-shear-sphere-kdtree-2balls test-shear-sphere-balltree-2balls

  active-mpi-profile:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MPI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install --upgrade pip setuptools wheel "Cython>=0.29.36,<4" "numpy>=2.0" mpi4py
      - name: Build the active MPI profile
        run: make -j2 cballs
      - name: Check scalar MPI partners
        run: |
          make test-kdtree-2balls-mpi
          make test-balltree-2balls-mpi
          make test-octree-2balls-mpi
      - name: Check forest and physical-3D MPI partners
        run: |
          make test-lya-forest-mpi
          make test-octree-3pcf-3d-mpi

  source-distribution:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
          python -m pip install --upgrade build twine
      - name: Build and inspect the source distribution
        run: |
          python -m build --sdist
          python -m twine check dist/*.tar.gz
          tar -tzf dist/*.tar.gz > /tmp/ctreeballs-sdist-files.txt
          grep -q '/addons/kdtree_2balls_omp/search_kdtree_2balls_omp.c$' /tmp/ctreeballs-sdist-files.txt
          grep -q '/addons/balltree_shared/fcfc_balltree.c$' /tmp/ctreeballs-sdist-files.txt
          grep -q '/addons/octree_2balls_omp/search_octree_2balls_omp.c$' /tmp/ctreeballs-sdist-files.txt
          grep -q '/addons/shear_sphere_shared/shear_sphere_engine.c$' /tmp/ctreeballs-sdist-files.txt
          grep -q '/addons/octree_3pcf_3d_omp/search_octree_3pcf_3d_omp.c$' /tmp/ctreeballs-sdist-files.txt
          ! grep -q '/addons/python_env/' /tmp/ctreeballs-sdist-files.txt
      - name: Install and import outside the checkout
        run: |
          python -m venv /tmp/ctreeballs-sdist
          /tmp/ctreeballs-sdist/bin/python -m pip install "$GITHUB_WORKSPACE"/dist/*.tar.gz
          cd /tmp
          /tmp/ctreeballs-sdist/bin/python -c "from cyballs import cballs; print(cballs().getVersion())"
