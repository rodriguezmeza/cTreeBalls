name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  support-coverage:
    uses: ./.github/workflows/support-matrix.yml

  build:
    needs: support-coverage
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-dev pkg-config libopenmpi-dev openmpi-bin libgsl-dev libcfitsio-dev zlib1g-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify the complete public release profile
        run: |
          python -m pip install -r requirements/release.txt
          python scripts/release_readiness.py run --component active --output release-active \
            --mpi-command 'mpiexec --oversubscribe --bind-to none'
      - name: Build and verify the isolated installed package
        run: |
          python scripts/release_readiness.py run --component package \
            --output release-package --jobs 2
      - name: Run required sanitizer checks
        run: |
          python scripts/release_readiness.py run --component sanitizers \
            --output release-sanitizers --jobs 2
      - uses: actions/download-artifact@v4
        with:
          name: support-coverage-decision
          path: support-coverage
      - name: Require a complete release decision before uploading the distribution
        if: always()
        run: |
          python scripts/release_readiness.py collect \
            --active release-active/result.json \
            --package release-package/result.json \
            --sanitizers release-sanitizers/result.json \
            --support support-coverage/support-coverage.json \
            --output release-readiness.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-evidence
          path: |
            release-readiness.json
            release-active/
            release-sanitizers/
            release-package/
            !release-package/**/native-env/**
            !release-package/**/install-env/**
            !release-package/**/native-source/**
            !release-package/**/wheel-source/**
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-dist
          path: release-package/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
